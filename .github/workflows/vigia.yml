name: Vigia da clínica

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      simular_queda:
        description: 'Testar o alarme (finge que o painel caiu)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Uma rodada longa por vez; a próxima espera na fila e emenda quando esta acabar. O teste do
# alarme tem fila própria — senão esperaria horas atrás da rodada em curso.
concurrency:
  group: vigia-${{ inputs.simular_queda && 'teste' || 'normal' }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Rodada longa (ver rodada.sh): ~5h40 checando a cada 5 min; o teto do GitHub é 6h.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Cai → issue com menção (e-mail) na hora; o job termina com falha se a última checagem
      # ainda estava fora (e-mail "Run failed" do GitHub como segundo aviso).
      - name: Vigiar (checa a cada 5 min)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULAR_QUEDA: ${{ inputs.simular_queda && '1' || '' }}
          TESTE: ${{ inputs.simular_queda && ' — TESTE do alarme, ignore' || '' }}
          # O teste do alarme faz uma checagem só; a próxima rodada normal fecha a issue.
          DURACAO_MIN: ${{ inputs.simular_queda && '1' || '340' }}
        run: |
          set +e
          bash rodada.sh
          echo "falhou=$?" >> "$GITHUB_OUTPUT"

      # O GitHub desliga agendamentos de repositório público parado há 60 dias.
      # Um sinal de vida a cada ~30 dias evita isso.
      - name: Sinal de vida
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -ge 2592000 ]; then
            date -u +%FT%TZ > ultimo-sinal.txt
            git config user.name "vigia"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ultimo-sinal.txt && git commit -m "sinal de vida" && git push
          fi

      - name: Falhar o job se terminou fora do ar (o GitHub manda e-mail de falha)
        if: steps.check.outputs.falhou != '0'
        run: exit 1
